<!doctype html>
<html lang="es" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Cursos para Blogger</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .gradient-header { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
    .module-card { transition: all 0.2s ease; }
    .module-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    #output-code { white-space: pre-wrap; word-break: break-all; font-family: 'Courier New', monospace; font-size: 12px; max-height: 400px; overflow-y: auto; }
  </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <style>body { box-sizing: border-box; }</style>
 </head>
 <body class="h-full bg-slate-50">
  <div id="app" class="h-full w-full overflow-auto">
   <header class="gradient-header text-white py-5 px-6 shadow-lg">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
     <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center"><i data-lucide="graduation-cap" class="w-5 h-5"></i>
      </div>
      <div>
       <h1 id="main-title" class="text-xl font-bold">Generador de Cursos</h1>
       <p class="text-slate-300 text-sm">Crea plantillas LMS profesionales para Blogger</p>
      </div>
     </div><span class="text-xs bg-white/10 px-3 py-1 rounded-full">v2.0</span>
    </div>
   </header>
   <main class="max-w-6xl mx-auto p-6">
    <div id="builder-section">
     <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6 fade-in">
      <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="info" class="w-5 h-5 text-emerald-600"></i> Datos Generales del Curso</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
       <div><label class="block text-sm font-medium text-slate-600 mb-1">Título del Curso *</label> <input type="text" id="course-title" placeholder="Ej: Marketing Digital Avanzado" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
       </div>
       <div><label class="block text-sm font-medium text-slate-600 mb-1">Subtítulo</label> <input type="text" id="course-subtitle" placeholder="Ej: Domina las estrategias más efectivas" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
       </div>
       <div><label class="block text-sm font-medium text-slate-600 mb-1">Instructor *</label> <input type="text" id="course-instructor" placeholder="Ej: Prof. María García" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
       </div>
       <div><label class="block text-sm font-medium text-slate-600 mb-1">URL Imagen Principal</label> <input type="url" id="course-image" placeholder="https://..." class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition" onchange="previewImage()" oninput="previewImage()">
       </div>
      </div>
      <div id="image-preview-container" class="hidden mt-4 pt-4 border-t border-slate-200"><label class="block text-sm font-medium text-slate-600 mb-2">Vista Previa</label> <img id="image-preview" src="" alt="Previa" class="max-w-sm rounded-xl shadow-md border border-slate-200">
      </div>
     </section>
    </div>
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6 fade-in">
     <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2"><i data-lucide="layers" class="w-5 h-5 text-emerald-600"></i> Módulos del Curso</h2><button onclick="addModule()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition"> <i data-lucide="plus" class="w-4 h-4"></i> Agregar Módulo </button>
     </div>
     <div id="modules-container"></div>
     <p id="no-modules" class="text-center text-slate-400 py-8">Aún no hay módulos. Haz clic en "Agregar Módulo" para comenzar.</p>
    </section>
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6 fade-in">
     <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="clipboard-check" class="w-5 h-5 text-emerald-600"></i> Evaluación Final</h2>
     <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="md:col-span-2"><label class="block text-sm font-medium text-slate-600 mb-1">Descripción de la Evaluación</label> <textarea id="course-eval-desc" placeholder="Ej: Completa este formulario para demostrar que has asimilado los conceptos principales del curso." class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition" rows="3"></textarea>
      </div>
      <div class="md:col-span-2"><label class="block text-sm font-medium text-slate-600 mb-1">URL de Google Forms</label> <input type="url" id="course-evaluation" placeholder="https://docs.google.com/forms/..." class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
      </div>
     </div>
    </section>
    <div class="text-center mb-6"><button onclick="generateCode()" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white px-8 py-4 rounded-2xl text-lg font-semibold shadow-lg shadow-emerald-200 transition transform hover:scale-[1.02]"> <span class="flex items-center gap-2"> <i data-lucide="code" class="w-5 h-5"></i> Generar Código para Blogger </span> </button>
    </div>
   </main>
  </div>
  <div id="output-section" class="hidden fade-in">
   <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
    <div class="flex items-center justify-between mb-4">
     <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2"><i data-lucide="file-code" class="w-5 h-5 text-emerald-600"></i> Código HTML Generado</h2>
     <div class="flex gap-2"><button onclick="copyCode()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-medium transition"> <i data-lucide="copy" class="w-4 h-4"></i> Copiar </button> <button onclick="downloadCode()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition"> <i data-lucide="download" class="w-4 h-4"></i> Descargar </button> <button onclick="backToBuilder()" class="flex items-center gap-2 bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition"> <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver </button>
     </div>
    </div>
    <div id="copy-toast" class="hidden mb-3 bg-emerald-50 text-emerald-700 text-sm px-4 py-2 rounded-xl border border-emerald-200">
     ✓ Código copiado al portapapeles
    </div>
    <div class="bg-slate-900 rounded-xl p-4 overflow-hidden">
     <pre id="output-code" class="text-emerald-400"></pre>
    </div>
   </div>
  </div>
  <script>
    let moduleCount = 0;

    const defaultConfig = {
      app_title: 'Generador de Cursos',
      primary_color: '#059669',
      background_color: '#f8fafc',
      text_color: '#1e293b',
      surface_color: '#ffffff',
      accent_color: '#334155',
      font_family: 'DM Sans',
      font_size: 16
    };

    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        const t = document.getElementById('main-title');
        if (t) t.textContent = config.app_title || defaultConfig.app_title;
      },
      mapToCapabilities: (config) => ({
        recolorables: [
          { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
          { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
          { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
          { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
          { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } }
        ],
        borderables: [],
        fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
        fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
      }),
      mapToEditPanelValues: (config) => new Map([
        ['app_title', config.app_title || defaultConfig.app_title]
      ])
    });

    function addModule() {
      moduleCount++;
      const container = document.getElementById('modules-container');
      document.getElementById('no-modules').classList.add('hidden');
      const div = document.createElement('div');
      div.className = 'module-card bg-slate-50 border border-slate-200 rounded-xl p-5 mb-4';
      div.id = `module-${moduleCount}`;
      div.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm font-semibold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">Módulo ${moduleCount}</span>
          <button onclick="removeModule(${moduleCount})" class="text-red-400 hover:text-red-600 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Título del Módulo *</label>
            <input type="text" data-field="title" placeholder="Ej: Introducción" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-slate-500 mb-1">Descripción (con formato)</label>
            <div class="border border-slate-200 rounded-lg overflow-hidden bg-white">
              <div class="flex flex-wrap gap-1 bg-slate-50 p-2 border-b border-slate-200">
                <button type="button" onclick="execCommand(this, 'bold')" title="Negrita" class="text-formatting-btn px-2.5 py-1.5 bg-white hover:bg-slate-200 rounded text-sm font-bold border border-slate-200 transition">B</button>
                <button type="button" onclick="execCommand(this, 'italic')" title="Cursiva" class="text-formatting-btn px-2.5 py-1.5 bg-white hover:bg-slate-200 rounded text-sm italic border border-slate-200 transition">I</button>
                <div class="w-px bg-slate-300"></div>
                <button type="button" onclick="insertHeading(this, 'h1')" title="Encabezado 1" class="text-formatting-btn px-2.5 py-1.5 bg-white hover:bg-slate-200 rounded text-xs font-bold border border-slate-200 transition">H1</button>
                <button type="button" onclick="insertHeading(this, 'h2')" title="Encabezado 2" class="text-formatting-btn px-2.5 py-1.5 bg-white hover:bg-slate-200 rounded text-xs font-bold border border-slate-200 transition">H2</button>
                <button type="button" onclick="insertHeading(this, 'h3')" title="Encabezado 3" class="text-formatting-btn px-2.5 py-1.5 bg-white hover:bg-slate-200 rounded text-xs font-bold border border-slate-200 transition">H3</button>
                <div class="w-px bg-slate-300"></div>
                <button type="button" onclick="insertList(this, 'ul')" title="Lista" class="text-formatting-btn px-2.5 py-1.5 bg-white hover:bg-slate-200 rounded text-sm border border-slate-200 transition">• Lista</button>
                <button type="button" onclick="insertList(this, 'ol')" title="Lista numerada" class="text-formatting-btn px-2.5 py-1.5 bg-white hover:bg-slate-200 rounded text-sm border border-slate-200 transition">1. Num</button>
              </div>
              <div data-field="desc" contenteditable="true" class="w-full px-3 py-2 min-h-24 max-h-40 overflow-y-auto text-sm focus:outline-none prose prose-sm max-w-none" style="word-wrap: break-word;"></div>
            </div>
            <p class="text-xs text-slate-400 mt-1">Usa los botones para dar formato al texto</p>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">ID o URL de YouTube</label>
            <input type="text" data-field="video" placeholder="Ej: dQw4w9WgXcQ o URL completa" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">URL de PDF</label>
            <input type="url" data-field="pdf" placeholder="https://..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>
      `;
      container.appendChild(div);
      lucide.createIcons();
    }

    function removeModule(id) {
      const el = document.getElementById(`module-${id}`);
      if (el) { el.remove(); }
      if (document.getElementById('modules-container').children.length === 0) {
        document.getElementById('no-modules').classList.remove('hidden');
      }
    }

    function extractYouTubeId(input) {
      if (!input) return '';
      const match = input.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([^&?\s]+)/);
      if (match) return match[1];
      if (/^[a-zA-Z0-9_-]{11}$/.test(input.trim())) return input.trim();
      return input.trim();
    }

    function getModules() {
      const modules = [];
      document.querySelectorAll('[id^="module-"]').forEach(m => {
        const title = m.querySelector('[data-field="title"]').value.trim();
        const desc = m.querySelector('[data-field="desc"]').innerHTML.trim();
        const video = m.querySelector('[data-field="video"]').value.trim();
        const pdf = m.querySelector('[data-field="pdf"]').value.trim();
        if (title) modules.push({ title, desc, video: extractYouTubeId(video), pdf });
      });
      return modules;
    }

    function execCommand(btn, cmd) {
      const moduleCard = btn.closest('.module-card');
      const editor = moduleCard.querySelector('[data-field="desc"]');
      if (editor) {
        editor.focus();
        document.execCommand(cmd, false, null);
        btn.style.background = document.queryCommandState(cmd) ? '#d1fae5' : 'white';
      }
    }

    function insertHeading(btn, tag) {
      const moduleCard = btn.closest('.module-card');
      const editor = moduleCard.querySelector('[data-field="desc"]');
      if (editor && editor.contentEditable) {
        editor.focus();
        const sel = window.getSelection();
        if (sel.rangeCount > 0) {
          const range = sel.getRangeAt(0);
          let text = range.extractContents();
          const heading = document.createElement(tag);
          heading.appendChild(text);
          range.insertNode(heading);
          range.collapse(false);
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }
    }

    function insertList(btn, type) {
      const moduleCard = btn.closest('.module-card');
      const editor = moduleCard.querySelector('[data-field="desc"]');
      if (editor && editor.contentEditable) {
        editor.focus();
        document.execCommand('insert' + (type === 'ul' ? 'Unordered' : 'Ordered') + 'List', false, null);
      }
    }

    function generateCode() {
      const title = document.getElementById('course-title').value.trim();
      const subtitle = document.getElementById('course-subtitle').value.trim();
      const instructor = document.getElementById('course-instructor').value.trim();
      const image = document.getElementById('course-image').value.trim();
      const evaluation = document.getElementById('course-evaluation').value.trim();
      const evalDesc = document.getElementById('course-eval-desc').value.trim();
      const modules = getModules();

      if (!title || !instructor || modules.length === 0) {
        showInlineError('Por favor completa el título, instructor y al menos un módulo.');
        return;
      }

      const modulesNav = modules.map((m, i) => `
        <li>
          <button onclick="showSection(${i})" id="nav-btn-${i}" class="nav-item" aria-current="page">
            <span class="nav-icon" id="nav-icon-${i}">${i + 1}</span>
            <span class="nav-label">${escHtml(m.title)}</span>
          </button>
        </li>`).join('');

      const modulesContent = modules.map((m, i) => {
        let videoHtml = '';
        if (m.video) {
          videoHtml = `<div style="margin-bottom:var(--space-8);"><div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--radius-lg);"><iframe src="https://www.youtube.com/embed/${escHtml(m.video)}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;" allowfullscreen></iframe></div></div>`;
        }
        let pdfHtml = '';
        if (m.pdf) {
          pdfHtml = `<div style="margin-bottom:var(--space-8);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--color-border);"><iframe src="${escHtml(m.pdf)}" style="width:100%;height:500px;border:none;display:block;"></iframe></div><a href="${escHtml(m.pdf)}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:var(--space-2);margin-top:var(--space-4);font-size:var(--text-sm);color:var(--color-primary);text-decoration:none;font-weight:500;">📄 Abrir PDF en nueva pestaña</a>`;
        }
        return `
        <div id="section-${i}" class="course-section" role="region" aria-labelledby="title-${i}">
          <div class="section-header">
            <h2 id="title-${i}">${escHtml(m.title)}</h2>
          </div>
          ${m.desc ? `<div class="section-body">${m.desc}</div>` : ''}
          ${videoHtml}
          ${pdfHtml}
          <div class="section-footer">
            <label class="complete-label">
              <input type="checkbox" onchange="markComplete(${i})" id="check-${i}"> 
              <span>Marcar como completado</span>
            </label>
            ${i < modules.length - 1 ? `<button class="btn-next" onclick="showSection(${i + 1})">Siguiente<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>` : (evaluation ? `<button class="btn-next" onclick="showSection('eval')">Evaluación<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>` : '')}
          </div>
        </div>`;
      }).join('');

      let evalSection = '';
      if (evaluation) {
        evalSection = `
        <div id="section-eval" class="course-section" role="region" aria-labelledby="title-eval">
          <div class="section-header">
            <h2 id="title-eval">Evaluación Final</h2>
          </div>
          ${evalDesc ? `<div class="section-body"><p>${escHtml(evalDesc)}</p></div>` : ''}
          <div class="eval-notice">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>Asegúrate de haber revisado todo el contenido antes de continuar. Al completar esta evaluación, tus respuestas serán registradas.</span>
          </div>
          <div class="eval-iframe-wrap">
            <iframe src="${escHtml(evaluation)}" title="Evaluación Final" allowfullscreen loading="lazy"></iframe>
          </div>
        </div>`;
      }

      const totalSections = modules.length;

      const outputHtml = `<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escHtml(title)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
  --color-surface-offset:#f3f0ec;--color-border:oklch(0.2 0.01 80/0.12);
  --color-divider:#dcd9d5;--color-text:#28251d;--color-text-muted:#7a7974;
  --color-text-faint:#bab9b4;--color-primary:#01696f;--color-primary-hover:#0c4e54;
  --color-primary-active:#0f3638;--color-primary-hl:oklch(0.75 0.05 192/0.18);
  --color-success:#437a22;--color-success-hl:#d4dfcc;
  --shadow-sm:0 1px 2px oklch(0.2 0.01 80/0.06);
  --shadow-md:0 4px 12px oklch(0.2 0.01 80/0.08);
  --shadow-lg:0 12px 32px oklch(0.2 0.01 80/0.12);
  --radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-xl:1rem;
  --radius-full:9999px;--space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;
  --space-4:1rem;--space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;
  --space-10:2.5rem;--space-12:3rem;--space-16:4rem;
  --text-xs:clamp(0.75rem,0.7rem + 0.25vw,0.875rem);
  --text-sm:clamp(0.875rem,0.8rem + 0.35vw,1rem);
  --text-base:clamp(1rem,0.95rem + 0.25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + 0.75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
  --font-body:'Inter',system-ui,sans-serif;
}
[data-theme="dark"]{
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#1d1c1a;--color-border:oklch(1 0 0/0.08);
  --color-divider:#262523;--color-text:#cdccca;--color-text-muted:#797876;
  --color-text-faint:#5a5957;--color-primary:#4f98a3;--color-primary-hover:#227f8b;

  window.markComplete = markComplete;
  showSection(0);
})();
